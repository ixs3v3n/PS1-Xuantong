<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="360" viewBox="0 0 1100 360">
<rect x="10" y="10" width="1080" height="340" rx="18" fill="white" stroke="#315EFB" stroke-width="3"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#222">
<text x="550" y="42" text-anchor="middle" font-size="24" font-weight="bold">Trust and Equitable Access in Digital Markets</text>
<text x="550" y="68" text-anchor="middle" font-size="14">Platform rules + reputation information + income uncertainty</text>

<rect x="35" y="95" width="180" height="100" rx="12" fill="#eef3ff" stroke="#315EFB"/>
<text x="125" y="121" text-anchor="middle" font-size="17" font-weight="bold">Platform Rules</text>
<text x="125" y="146" text-anchor="middle" font-size="13">Refundable /</text>
<text x="125" y="164" text-anchor="middle" font-size="13">non-transferable</text>
<text x="125" y="181" text-anchor="middle" font-size="13">vs. transferable</text>

<rect x="245" y="95" width="180" height="100" rx="12" fill="#eef3ff" stroke="#315EFB"/>
<text x="335" y="121" text-anchor="middle" font-size="17" font-weight="bold">Reputation</text>
<text x="335" y="146" text-anchor="middle" font-size="13">reliability × visibility</text>
<text x="335" y="168" text-anchor="middle" font-size="13">seller signals</text>
<text x="335" y="185" text-anchor="middle" font-size="13">and trust</text>

<rect x="455" y="95" width="180" height="100" rx="12" fill="#eef3ff" stroke="#315EFB"/>
<text x="545" y="121" text-anchor="middle" font-size="17" font-weight="bold">Buyer Behavior</text>
<text x="545" y="146" text-anchor="middle" font-size="13">bounded rationality</text>
<text x="545" y="168" text-anchor="middle" font-size="13">income uncertainty</text>
<text x="545" y="185" text-anchor="middle" font-size="13">trust / bidding</text>

<rect x="665" y="95" width="180" height="100" rx="12" fill="#eef3ff" stroke="#315EFB"/>
<text x="755" y="121" text-anchor="middle" font-size="17" font-weight="bold">Market Outcomes</text>
<text x="755" y="146" text-anchor="middle" font-size="13">trade probability</text>
<text x="755" y="168" text-anchor="middle" font-size="13">speculation</text>
<text x="755" y="185" text-anchor="middle" font-size="13">allocation</text>

<rect x="875" y="95" width="180" height="100" rx="12" fill="#eef3ff" stroke="#315EFB"/>
<text x="965" y="121" text-anchor="middle" font-size="17" font-weight="bold">Equitable Access</text>
<text x="965" y="146" text-anchor="middle" font-size="13">genuine consumers</text>
<text x="965" y="168" text-anchor="middle" font-size="13">vs. speculative</text>
<text x="965" y="185" text-anchor="middle" font-size="13">crowding</text>

<g stroke="#14877D" stroke-width="3" fill="none" marker-end="url(#arrow)">
<path d="M215 145 L245 145"/><path d="M425 145 L455 145"/><path d="M635 145 L665 145"/><path d="M845 145 L875 145"/>
</g>
<text x="550" y="232" text-anchor="middle" font-size="16" font-weight="bold">Three disciplinary lenses</text>
<text x="550" y="258" text-anchor="middle" font-size="14">Behavioral science: trust and heuristic response</text>
<text x="550" y="280" text-anchor="middle" font-size="14">Economics: participation constraints and equitable allocation</text>
<text x="550" y="302" text-anchor="middle" font-size="14">Computer science: simulation of interacting rules, signals, and heterogeneous buyers</text>
<text x="550" y="328" text-anchor="middle" font-size="13" font-style="italic">Goal: identify rule + information combinations that reduce speculation without excluding genuine consumers.</text>
</g>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#14877D"/></marker></defs>
</svg>
